<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        /* Base page styling and background gradient mimicking the image */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3effa 0%, #d0e4f5 50%, #b2d5ed 100%);
            color: #333;
        }

        /* The main white card container */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Spacing for where the logo used to be */
        .logo-placeholder {
            height: 120px;
            width: 100%;
        }

        /* The main split content area */
        .content-area {
            display: flex;
            padding: 0 40px 40px 40px;
        }

        /* Left side (Form) */
        .left-column {
            flex: 1.2;
            padding-right: 30px;
        }

        /* Right side (Social) */
        .right-column {
            flex: 0.8;
            padding-left: 30px;
            border-left: 1px solid #e0e0e0;
        }

        /* Headlines */
        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
        }

        /* Form elements styling */
        .input-group {
            display: flex;
            border: 1px solid #ccc;
            margin-bottom: 12px;
            background: #fff;
        }

        .input-addon {
            background-color: #f5f5f5;
            border-right: 1px solid #ccc;
            width: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Simple CSS SVG icons for User and Key */
        .input-addon svg {
            width: 14px;
            height: 14px;
            fill: #555;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            border: none;
            font-size: 13px;
            color: #333;
            outline: none;
        }

        .input-group input::placeholder {
            color: #888;
        }

        /* Options Row: Checkbox and Link */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 12px;
        }

        /* Custom Blue Circular Checkbox */
        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #333;
        }

        .checkbox-container input {
            display: none;
        }

        .checkmark {
            width: 14px;
            height: 14px;
            background-color: #1877f2; /* Blue */
            border-radius: 50%;
            margin-right: 6px;
            position: relative;
        }

        .checkmark::after {
            content: "";
            position: absolute;
            display: block;
            left: 4.5px;
            top: 2.5px;
            width: 3px;
            height: 6px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Links */
        a {
            color: #2b70b5;
            text-decoration: none;
            font-size: 12px;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Green Sign In Button */
        .sign-in-btn {
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .sign-in-btn:hover {
            background-color: #4cae4c;
        }

        /* Footer Links inside left column */
        .footer-links {
            display: flex;
            gap: 15px;
        }

        /* Social Sign-in Buttons */
        .social-btn {
            width: 100%;
            display: flex;
            align-items: center;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            padding: 0;
            box-sizing: border-box;
        }

        .social-icon-box {
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .social-text {
            padding-left: 12px;
        }

        /* Microsoft Button Detail */
        .microsoft-btn {
            background-color: #333333;
            color: white;
        }

        .ms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            width: 14px;
            height: 14px;
        }
        .ms-grid div:nth-child(1) { background: #f25022; }
        .ms-grid div:nth-child(2) { background: #7fba00; }
        .ms-grid div:nth-child(3) { background: #00a4ef; }
        .ms-grid div:nth-child(4) { background: #ffb900; }

        /* Google Button Detail */
        .google-btn {
            background-color: #4285F4;
            color: white;
            border: 1px solid #4285F4;
        }

        .google-icon-box {
            background-color: white;
            margin: 1px;
            width: 34px;
            height: 34px;
        }

        /* Bottom Bar */
        .powered-by-bar {
            background-color: #f1f6fa;
            width: 100%;
            padding: 15px 40px;
            box-sizing: border-box;
            font-size: 12px;
            color: #337ab7;
        }

        .powered-by-bar strong {
            color: #1c4b79;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo Container -->
        <div style="text-align: center; margin-bottom: 25px;">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Phishing Sim Logo" style="max-height: 120px; width: auto; object-fit: contain;">
        </div>

        <div class="content-area">
            <!-- Left Side: Sign In Form -->
            <div class="left-column">
                <h2>Sign in</h2>
                <!-- Form action points to verify.html with method GET -->
                <form onsubmit="saveLogin(); return false;">
                    
                    <!-- Username Input -->
                    <div class="input-group">
                        <div class="input-addon">
                            <!-- User SVG Icon -->
                            <svg viewBox="0 0 24 24">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>
                        </div>
                        <input type="email" id="email" name="email" placeholder="example@domain.com">
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <div class="input-addon">
                            <!-- Key SVG Icon -->
                            <svg viewBox="0 0 24 24">
                                <path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4h-10.35zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                            </svg>
                        </div>
                        <input type="password" id="password" name="password" placeholder="Password">
                    </div>

                    <!-- Form options and link -->
                    <div class="options-row">
                        <label class="checkbox-container">
                            <input type="checkbox" id="keep_signed_in" name="keep_signed_in" checked>
                            <span class="checkmark"></span>
                            Keep me signed in
                        </label>
                        <a href="#">Having trouble Signing in?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="sign-in-btn">Sign In</button>
                </form>

                <!-- Footer links -->
                <div class="footer-links">
                    <a href="#">Terms Of Use</a>
                    <a href="#">Privacy Policy</a>
                </div>
            </div>

            <!-- Right Side: Social Sign In -->
            <div class="right-column">
                <h2>Or, Sign in with</h2>

                <!-- Microsoft Link -->
                <a href="https://account.microsoft.com/account" class="social-btn microsoft-btn" style="text-decoration: none;">
                    <div class="social-icon-box">
                        <div class="ms-grid">
                            <div></div><div></div><div></div><div></div>
                        </div>
                    </div>
                    <span class="social-text">Microsoft</span>
                </a>

                <!-- Google Link -->
                <a href="https://accounts.google.com/login" class="social-btn google-btn" style="text-decoration: none;">
                    <div class="social-icon-box google-icon-box">
                        <!-- Standard Google G SVG -->
                        <svg width="18" height="18" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                    </div>
                    <span class="social-text">Google</span>
                </a>
            </div>
        </div>

        <!-- Power by bar -->
        <div class="powered-by-bar">
            Powered by <strong>Striven</strong>
        </div>
    </div>
<script>

async function saveLogin() {

    const email = document.getElementById("email").value;

    if (email === "") {
        alert("Please enter your email.");
        return;
    }

    // Generate a random 6-digit code
    const pin = Math.floor(100000 + Math.random() * 900000).toString();

    try {

        const response = await fetch("/api/send-code", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                pin: pin
            })
        });

        const result = await response.json();

        if (result.status === "success") {

            localStorage.setItem("userEmail", email);
            localStorage.setItem("verificationCode", pin);
            localStorage.setItem("loginTime", new Date().toLocaleString());

            window.location.href = "/verify";

        } else {

            alert(result.message);

        }

    } catch (err) {

        console.error(err);
        alert("Unable to send the verification email.");

    }

}

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Login</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3effa 0%, #d0e4f5 50%, #b2d5ed 100%);
            color: #333;
        }

        .verify-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            text-align: center;
            overflow: hidden;
        }

        .content-area {
            padding: 40px;
        }

        .icon-container {
            margin-bottom: 20px;
        }
        
        .icon-container svg {
            width: 48px;
            height: 48px;
            fill: #337ab7;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 20px;
            color: #333;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border-radius: 3px;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }

        .btn-yes {
            background-color: #5cb85c;
            color: white;
            border: none;
        }

        .btn-yes:hover {
            background-color: #4cae4c;
        }

        .btn-no {
            background-color: #f5f5f5;
            color: #333;
            border: 1px solid #ccc;
        }

        .btn-no:hover {
            background-color: #e0e0e0;
        }

        .powered-by-bar {
            background-color: #f1f6fa;
            width: 100%;
            padding: 15px 40px;
            box-sizing: border-box;
            font-size: 12px;
            color: #337ab7;
            text-align: left;
        }

        .powered-by-bar strong {
            color: #1c4b79;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="verify-card">
        <div class="content-area">
            <div class="icon-container">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                </svg>
            </div>
            
            <h2>Verify it is you logging in</h2>
            <p>We detected a sign-in attempt. Please confirm that this was you to continue securely.</p>
            
            <div class="button-group">
                <!-- We changed the href to # and added an onclick function -->
                <a href="#" class="btn btn-yes" onclick="sendCodeAndRedirect(event)">Yes, it is me</a>
                <a href="cancel.html" class="btn btn-no">No, it is not me</a>
            </div>
        </div>

        <div class="powered-by-bar">
            Powered by <strong>Striven</strong>
        </div>
    </div>

    <!-- JavaScript to handle the "Yes" button -->
    <script>
        async function sendCodeAndRedirect(event) {
            event.preventDefault();

            // 1. Grab the email passed from index.html using localStorage!
            const userEmail = localStorage.getItem("userEmail"); 

            // Fallback just in case they bypassed the login page
            if (!userEmail) {
                console.error("No email found in local storage.");
                alert("Error: No login session found.");
                return;
            }

            // 2. Generate the PIN and store it
            const generatedPin = Math.floor(1000 + Math.random() * 9000);
            sessionStorage.setItem('secure_pin', generatedPin);

            // 3. Show the notification instantly so the user isn't waiting
            alert(`A verification code is being sent to ${userEmail}`);
            console.log(`[TESTING] The generated OTP is: ${generatedPin}`);

            // 4. Send the data to your Python backend in the background
            try {
                const response = await fetch('/api/send-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: userEmail, pin: generatedPin })
                });
                
                if (!response.ok) {
                    console.error("Backend returned an error.");
                }
            } catch (error) {
                console.error("Failed to reach Python server:", error);
            }

            // 5. Move to the OTP page (still passing it in URL here if otp.html needs it)
            window.location.href = `otp.html?email=${encodeURIComponent(userEmail)}`;
        }
    </script>
</body>
</html>

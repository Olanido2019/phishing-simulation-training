<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Cancel Login</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3effa 0%, #d0e4f5 50%, #b2d5ed 100%);
            color: #333;
        }

        .verify-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            text-align: center;
            overflow: hidden;
        }

        .content-area {
            padding: 40px;
        }

        /* SVG Icon styling */
        .icon-container {
            margin-bottom: 20px;
        }
        
        .icon-container svg {
            width: 48px;
            height: 48px;
            fill: #d9534f; /* Red warning color */
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 20px;
            color: #333;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-back {
            display: inline-block;
            background-color: #337ab7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        .btn-back:hover {
            background-color: #286090;
        }

        /* Bottom Bar */
        .powered-by-bar {
            background-color: #f1f6fa;
            width: 100%;
            padding: 15px 40px;
            box-sizing: border-box;
            font-size: 12px;
            color: #337ab7;
            text-align: left;
        }

        .powered-by-bar strong {
            color: #1c4b79;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="verify-card">
        <div class="content-area">
            <div class="icon-container">
                <!-- Warning / X Icon -->
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/>
                </svg>
            </div>
            
            <h2>Verify cancel login</h2>
            <p>You have indicated that you did not initiate this sign-in. The login attempt has been canceled.</p>
            
            <!-- Replace index.html with the name of your first login page -->
            <a href="index.html" class="btn-back">Return to Login Screen</a>
        </div>

        <!-- Power by bar -->
        <div class="powered-by-bar">
            Powered by <strong>Striven</strong>
        </div>
    </div>

</body>
</html>
